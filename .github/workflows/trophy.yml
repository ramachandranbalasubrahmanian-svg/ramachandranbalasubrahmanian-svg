name: Generate GitHub Trophy SVG

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trophy:
    runs-on: ubuntu-latest
    name: generate-trophy

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophy SVG via Deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p trophy
          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            https://raw.githubusercontent.com/ryo-ma/github-profile-trophy/master/render_svg.ts \
            ramachandranbalasubrahmanian-svg \
            trophy \
            tokyonight

      - name: Commit and push trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy/
          git diff --cached --quiet || git commit -m "Generate GitHub trophy SVG"
          git push
